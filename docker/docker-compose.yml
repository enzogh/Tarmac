services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tarmac
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/tarmac
      JWT_SECRET: change-me
      AGENT_SHARED_TOKEN: agent-secret
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@tarmac.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      ENABLE_DEFAULT_ADMIN: ${ENABLE_DEFAULT_ADMIN:-true}
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      - postgres
      - redis

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        # Remplace par l'IP publique de ton serveur
        NEXT_PUBLIC_API_URL: http://CHANGE_MOI_IP_SERVEUR:3001
    environment:
      NEXT_PUBLIC_API_URL: http://CHANGE_MOI_IP_SERVEUR:3001
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
