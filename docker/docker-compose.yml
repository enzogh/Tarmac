services:
  postgres:
    image: postgres:16
    entrypoint: ["/bin/sh", "/docker-entrypoint-tarmac.sh"]
    command: ["postgres"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-tarmac}
    ports:
      - "${POSTGRES_BIND:-127.0.0.1}:5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./postgres-entrypoint-tarmac.sh:/docker-entrypoint-tarmac.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:?REDIS_PORT must be set}:6379"
    volumes:
      - ./data/redis:/data

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-tarmac}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_SECRET_PREVIOUS: ${JWT_SECRET_PREVIOUS:-}
      AGENT_SHARED_TOKEN: ${AGENT_SHARED_TOKEN:?AGENT_SHARED_TOKEN must be set}
      # Chiffre au repos les clés VPN et secrets TSIG (voir common/secret-box.ts).
      TARMAC_SECRETS_KEY: ${TARMAC_SECRETS_KEY:?TARMAC_SECRETS_KEY must be set}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@tarmac.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      ENABLE_DEFAULT_ADMIN: ${ENABLE_DEFAULT_ADMIN:-true}
      PORT: 3001
      # .git is excluded from the build context (see ../.dockerignore), so
      # getControlPlaneVersion() can't detect the commit in-container and
      # falls back to a bare "unknown" - reusing the same GITHUB_SHA that
      # deploy.sh computes on the host for the web app's NEXT_PUBLIC_APP_VERSION
      # below keeps the agent-version comparison and the footer badge showing
      # the exact same commit instead of two independently-drifting values.
      TARMAC_CONTROL_VERSION: ${GITHUB_SHA:-dev-local}
      FRONTEND_URL: ${FRONTEND_URL:-https://tarmac.casterot.com}
      AUTHENTIK_ISSUER_URL: ${AUTHENTIK_ISSUER_URL:-https://auth.casterot.com/application/o/tarmac/}
      AUTHENTIK_CLIENT_ID: ${AUTHENTIK_CLIENT_ID:-}
      AUTHENTIK_CLIENT_SECRET: ${AUTHENTIK_CLIENT_SECRET:-}
      AUTHENTIK_REDIRECT_URI: ${AUTHENTIK_REDIRECT_URI:-https://tarmac.casterot.com/api/v1/auth/sso/callback}
      AUTHENTIK_SCOPES: ${AUTHENTIK_SCOPES:-openid profile email tarmac}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-25}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-Tarmac <tarmac@intraced.fr>}
      SMTP_TLS_REJECT_UNAUTHORIZED: ${SMTP_TLS_REJECT_UNAUTHORIZED:-true}
      ALERT_EMAIL_INTERNAL_DOMAIN: ${ALERT_EMAIL_INTERNAL_DOMAIN:-intraced.fr}
      ALERT_EMAIL_QUIET_SECONDS: ${ALERT_EMAIL_QUIET_SECONDS:-45}
      ALERT_EMAIL_MAX_WAIT_SECONDS: ${ALERT_EMAIL_MAX_WAIT_SECONDS:-300}
      ALERT_EMAIL_TIMEZONE: ${ALERT_EMAIL_TIMEZONE:-Europe/Paris}
    ports:
      - "${VRACK_IP:?VRACK_IP must be set}:3001:3001"
    depends_on:
      - postgres
      - redis

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
        NEXT_PUBLIC_APP_VERSION: ${GITHUB_SHA:-dev-local}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
      NEXT_PUBLIC_APP_VERSION: ${GITHUB_SHA:-dev-local}
    ports:
      - "${VRACK_IP:?VRACK_IP must be set}:3000:3000"
    depends_on:
      - api
