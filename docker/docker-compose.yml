services:
  postgres:
    image: postgres:16
    entrypoint: ["/bin/sh", "/docker-entrypoint-tarmac.sh"]
    command: ["postgres"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-tarmac}
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./postgres-entrypoint-tarmac.sh:/docker-entrypoint-tarmac.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-tarmac}
      JWT_SECRET: change-me
      AGENT_SHARED_TOKEN: agent-secret
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@tarmac.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      ENABLE_DEFAULT_ADMIN: ${ENABLE_DEFAULT_ADMIN:-true}
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      - postgres
      - redis

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
        NEXT_PUBLIC_APP_VERSION: ${GITHUB_SHA:-dev-local}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
      NEXT_PUBLIC_APP_VERSION: ${GITHUB_SHA:-dev-local}
    ports:
      - "3000:3000"
    depends_on:
      - api
