<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- The mark as a servable asset, for places outside the app that need a
       URL rather than the BrandMark component - the Authentik SSO console
       among them, whose application icon field accepts a URL only.
       #8455f1 is the primary token (hsl 258 85% 64%) written out, since an SVG file
       can't read the design token; keep it in step with app/icon.svg.
       Drawn at 512 rather than the favicon's 32 on purpose: a consumer that
       sizes an icon by its intrinsic dimensions renders a 32px file as a
       32px stamp in a 96px tile instead of scaling it up. -->
  <rect width="512" height="512" rx="128" fill="#8455f1"/>
  <g fill="none" stroke="#ffffff" stroke-width="41.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M256 104 104 176l152 72 152-72-152-72Z"/>
    <path d="M104 256l152 72 152-72"/>
    <path d="M104 336l152 72 152-72"/>
  </g>
</svg>
